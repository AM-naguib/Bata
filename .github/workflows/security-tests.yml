name: Attendify security regression
on:
  push:
    branches:
      - "audit/**"
  pull_request:
jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (verified npm package manifest)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check portal JavaScript syntax
        run: npm run test:syntax
      - name: Run API and security regression tests
        run: npm test
