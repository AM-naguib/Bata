name: Attendify live deployment smoke check
on:
  push:
    branches:
      - feature/superadmin-accounts-courses
    paths:
      - .github/workflows/live-smoke.yml
  pull_request:
    branches:
      - feature/teacher-student-improvements
    paths:
      - .github/workflows/live-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check deployed Neon DB readiness, public login page and private API boundaries
        shell: bash
        env:
          BASE: https://bata-attendify-node.onrender.com
        run: |
          set -euo pipefail
          echo "Waiting for Render Free service to wake and become ready..."
          for attempt in $(seq 1 12); do
            if curl --silent --show-error --fail --max-time 30 "$BASE/healthz" -o /tmp/health.json; then
              break
            fi
            sleep 10
          done
          python3 - <<'PY'
          import json
          with open('/tmp/health.json',encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('status')=='ok', 'Private Neon connection not ready'
          print('Health check: database reachable')
          PY
          curl --silent --show-error --fail --max-time 40 "$BASE/portal" -o /tmp/portal.html
          grep -q 'id="loginForm"' /tmp/portal.html
          echo "Portal: login form served"
          curl --silent --show-error --fail --max-time 40 "$BASE/" -o /tmp/home.html
          grep -q 'href="/admin"' /tmp/home.html
          grep -q 'href="/lecturer"' /tmp/home.html
          grep -q 'href="/student"' /tmp/home.html
          echo "Landing: three role entries served"
          curl --silent --show-error --fail --max-time 40 "$BASE/admin" -o /tmp/admin.html
          grep -q 'id="adminControls"' /tmp/admin.html
          grep -q 'data-gateway="superadmin"' /tmp/admin.html
          grep -q 'data-gateway="lecturer"' /tmp/admin.html
          grep -q 'data-gateway="student"' /tmp/admin.html
          echo "Admin: three visible entry gates and dashboard interface served"
          curl --silent --show-error --fail --max-time 40 "$BASE/lecturer" -o /tmp/lecturer.html
          grep -q 'id="lecturerControls"' /tmp/lecturer.html
          grep -q 'id="rosterSearch"' /tmp/lecturer.html
          echo "Lecturer: dashboard and roster search served"
          curl --silent --show-error --fail --max-time 40 "$BASE/student" -o /tmp/student.html
          grep -q 'غير مفعّل حاليًا' /tmp/student.html
          echo "Student: safe guide served and attendance disabled"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/me.json -w '%{http_code}' "$BASE/api/v2/me")
          test "$status" = 401
          echo "Session: unauthorized request rejected (401)"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/change.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d '{"currentPassword":"not-a-valid-secret","newPassword":"not-a-valid-secret-either"}' \
            "$BASE/api/v2/password")
          test "$status" = 401
          echo "Password change: unauthenticated requests rejected (401)"
          curl --silent --show-error --fail --max-time 30 "$BASE/app-v2.js" -o /tmp/staff-ui.js
          grep -q 'lecturers/password/reset' /tmp/staff-ui.js
          grep -q 'إعادة تعيين الباسورد' /tmp/staff-ui.js
          echo "Lecturer reset: button and API call in deployed staff UI"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/reset-unauth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -d '{"lecturerId":"00000000-0000-4000-8000-000000000001"}' \
            "$BASE/api/v2/lecturers/password/reset")
          test "$status" = 401
          echo "Lecturer reset: unauthorized requests rejected (401); no credentials modified"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/roster.json -w '%{http_code}' "$BASE/api/v2/lecturer/courses/ced5eb59-87cc-4286-a8ec-8a08d4d5a7b1/students")
          test "$status" = 401
          echo "Roster: unauthorized request rejected (401)"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/report-unauth.json -w '%{http_code}' "$BASE/api/v2/lecturer/courses/ced5eb59-87cc-4286-a8ec-8a08d4d5a7b1/report")
          test "$status" = 401
          status=$(curl --silent --show-error --max-time 30 -o /tmp/excel-unauth.json -w '%{http_code}' "$BASE/api/v2/lecturer/courses/ced5eb59-87cc-4286-a8ec-8a08d4d5a7b1/report.xlsx")
          test "$status" = 401
          echo "Lecturer-only reports and Excel: anonymous requests rejected (401)"
          curl --silent --show-error --fail --max-time 30 "$BASE/lecturer" -o /tmp/report-panel.html
          grep -q 'id="reportCourse"' /tmp/report-panel.html
          grep -q 'id="reportDownload"' /tmp/report-panel.html
          echo "Lecturer reports: secure download interface served"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/attendance.json -w '%{http_code}' "$BASE/api/v2/attendance/checkin")
          test "$status" = 404
          echo "Student check-in: feature disabled as configured"
          status=$(curl --silent --show-error --max-time 30 -o /tmp/old.json -w '%{http_code}' "$BASE/api/report")
          test "$status" = 404
          echo "Legacy attendance report: disabled"
